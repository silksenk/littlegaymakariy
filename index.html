<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="./index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <title>Дырявый в центре</title>
</head>
<body onpointermove="document.getElementById('bgAudio').play();" 
      onclick="document.getElementById('bgAudio').play();" 
      onscroll="document.getElementById('bgAudio').play();">

    
    <video class="video-bg" autoplay loop muted playsinline>
        <source src="background.mp4" type="video/mp4">
    </video>

    <audio id="bgAudio" loop preload="auto">
        <source src="background.aac" type="audio/aac">
    </audio>

    
    <div class="content">
        <div class="canvas-container">
            <button class="arrow-btn" id="prevBtn">❬</button>
            <canvas id="canvas" width="500" height="500"></canvas>
            <button class="arrow-btn" id="nextBtn">❭</button>
        </div>
        
        <p>Нажми что бы обстрелять спермой лоха!</p>

        <div>
            <button class="clear-btn" id="clearBtn">Смыть сперму</button>
            <a href="https://www.donationalerts.com/r/yapsixebaniy" target="_blank" class="donate-btn">
                Поблагодарить за удовольствие 💰
            </a>
        </div>
    </div>

    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const audio = document.getElementById('bgAudio');

        let isDrawing = false; 
        let lastSplatterTime = 0; 
        let drawingOpacity = 1.0; 
        let isClearing = false;
        let splatters = []; 
        const splatterInterval = 40; 

        const images = ['zov.jpg', 'zov1.jpg', 'zov2.jpg', 'zov3.jpg']; 
        let currentImgIndex = 0; 

        const img = new Image();

        function drawBaseImage() {
            if (img.complete && img.naturalWidth !== 0) {
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            }
        }

        function loadCanvasImage() {
            isClearing = false;      
            drawingOpacity = 1.0;     
            splatters = [];           
            img.src = images[currentImgIndex];
        }

        img.onload = function() {
            render();
        };
        loadCanvasImage();

        prevBtn.addEventListener('click', function() {
            currentImgIndex--;
            if (currentImgIndex < 0) currentImgIndex = images.length - 1;
            loadCanvasImage();
        });

        nextBtn.addEventListener('click', function() {
            currentImgIndex++;
            if (currentImgIndex >= images.length) currentImgIndex = 0;
            loadCanvasImage();
        });

        clearBtn.addEventListener('click', function() {
            if (isClearing || splatters.length === 0) return;
            isClearing = true;

            const startTime = Date.now();
            const duration = 4000; 

            function fadeOut() {
                const elapsed = Date.now() - startTime;
                drawingOpacity = 1.0 - (elapsed / duration);

                if (drawingOpacity <= 0) {
                    drawingOpacity = 1.0;
                    splatters = []; 
                    isClearing = false; 
                    render();
                } else {
                    render();
                    requestAnimationFrame(fadeOut); 
                }
            }
            requestAnimationFrame(fadeOut);
        });

        function generateBlobPoints(centerX, centerY, baseRadius, numPoints = 12) {
            const points = [];
            for (let i = 0; i < numPoints; i++) {
                const angle = (i / numPoints) * Math.PI * 2;
                const randomRadius = baseRadius * (0.6 + Math.random() * 0.6);
                points.push({
                    x: centerX + Math.cos(angle) * randomRadius,
                    y: centerY + Math.sin(angle) * randomRadius
                });
            }
            return points;
        }

        function drawSavedBlob(points) {
            if (points.length === 0) return;
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            ctx.fill();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            drawBaseImage(); 

            ctx.save();
            ctx.globalAlpha = drawingOpacity;

            splatters.forEach(s => {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                drawSavedBlob(s.mainBlobPoints);

                s.subBlobsData.forEach(sb => {
                    drawSavedBlob(sb.points);
                });

                s.dropsData.forEach(d => {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
                    
                    if (d.type === 'line') {
                        ctx.beginPath();
                        ctx.lineWidth = d.dropRadius * 1.5;
                        ctx.lineCap = 'round';
                        ctx.moveTo(d.startX, d.startY);
                        ctx.lineTo(d.endX, d.endY);
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(d.endX, d.endY, d.dropRadius * 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (d.type === 'circle') {
                        ctx.beginPath();
                        ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
            });
            ctx.restore();
        }

        function addSplatter(x, y) {
            const baseRadius = Math.random() * 15 + 15;
            const mainBlobPoints = generateBlobPoints(x, y, baseRadius, 14);
            
            const subBlobsData = [];
            const numSubBlobs = Math.floor(Math.random() * 4) + 2;
            for (let i = 0; i < numSubBlobs; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = baseRadius * (1.1 + Math.random() * 1.2);
                const bx = x + Math.cos(angle) * distance;
                const by = y + Math.sin(angle) * distance;
                const br = baseRadius * (0.15 + Math.random() * 0.25);
                subBlobsData.push({
                    points: generateBlobPoints(bx, by, br, 8)
                });
            }

            const dropsData = [];
            const numDrops = Math.floor(Math.random() * 3) + 1;
            for (let i = 0; i < numDrops; i++) {
                const startX = x + (Math.random() * baseRadius - baseRadius / 2);
                const startY = y + (Math.random() * baseRadius * 0.5);
                const length = Math.random() * 40 + 20;
                const dropRadius = Math.random() * 2 + 1.5;

                dropsData.push({
                    type: 'line',
                    startX: startX,
                    startY: startY,
                    endX: startX,
                    endY: startY + length,
                    dropRadius: dropRadius
                });

                if (Math.random() > 0.4) {
                    dropsData.push({
                        type: 'circle',
                        x: startX,
                        y: startY + length + Math.random() * 20 + 10,
                        r: dropRadius * (0.7 + Math.random() * 0.5)
                    });
                }
            }

            splatters.push({ mainBlobPoints, subBlobsData, dropsData });
            render();
        }

        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            return {
                x: ((clientX - rect.left) / rect.width) * canvas.width,
                y: ((clientY - rect.top) / rect.height) * canvas.height
            };
        }

        function handleStart(e) {
            if (isClearing) return;
            isDrawing = true;
            const coords = getCanvasCoordinates(e);
            addSplatter(coords.x, coords.y);
            lastSplatterTime = Date.now();
        }

        function handleMove(e) {
            if (!isDrawing || isClearing) return;
            if (e.touches) e.preventDefault();
            
            const now = Date.now();
            if (now - lastSplatterTime > splatterInterval) {
                const coords = getCanvasCoordinates(e);
                addSplatter(coords.x, coords.y);
                lastSplatterTime = now;
            }
        }

        function handleEnd() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        canvas.addEventListener('touchstart', handleStart, { passive: false });
        canvas.addEventListener('touchmove', handleMove, { passive: false });
        canvas.addEventListener('touchend', handleEnd);
    </script>
    
<div class="ai-modal-overlay" id="aiDisclaimerModal">
    <div class="ai-modal-window">
        <div class="ai-modal-text">
            Все персонажи и лица в данном приложении сгенерированы искусственным интеллектом (ИИ). Любое сходство с реальными людьми абсолютно случайно и не задумывалось авторами.
        </div>
        <button class="ai-modal-btn" onclick="closeAiModal()">Понятно</button>
    </div>
</div>

<script>
    
    function closeAiModal() {
        document.getElementById('aiDisclaimerModal').style.display = 'none';
    }
</script>

</body>
</html>
